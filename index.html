<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css"
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/axios@1.13.2/dist/axios.min.js"></script> 
<title>Weather Forecast</title>
</head>
<body>
    <div class="forecast-app">
    <header>
        <form class="search-form" id="search-form">
            <input type="search" placeholder="Enter a city..." required id="search-form-input" class="search-form-input" />
            <input type="submit" value="search" class="search-form-button"/>
        </form>
    </header>
    <main>
        <div class="forecast-app-data">
        <div>
        <h1 class="forecast-app-city" id="city">Paris</h1>
    <p class="forecast-app-details">
        Tuesday 14:49, scattered clouds
        <br />
        Humidity: <strong>66%</strong>, Wind: <strong>3.13km/h</strong>
    </p>
        </div>
    <div class="forecast-app-temperature-container">
       <div class="forecast-app-icon">⛅</div>  
        <div class="forecast-app-temperature">12</div>
        <div class="forecast-app-unit">℃</div>
    </div>
        </div>
    </main>
    <footer>
        This project was Coded by
        <a href="https://github.com/Royalty-Ree"> Relebohile Puso</a>, 
        is 
        <a href="https://github.com/Royalty-Ree/ForecastFusion">open-sourced on Github</a>
        and hosted on 
        <a href="https://forecastfusion101.netlify.app/">netlify</a>
    </footer>
</div>
<script src="src/app.js"></script>
</body>
</html>
